name: Build and Publish Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine Version & Tag
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$VERSION" ]; then
              VERSION="5.0"
            fi
            TAG="v${VERSION}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Building Release for Tag: ${TAG}"

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Asset
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk "release-output/ExpenseTracker-${{ env.RELEASE_TAG }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Expense Tracker ${{ env.RELEASE_TAG }}
          files: release-output/ExpenseTracker-${{ env.RELEASE_TAG }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
